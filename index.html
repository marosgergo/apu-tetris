<!DOCTYPE html>
<html lang="hu">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0a0e1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Apu Tetris" />
  <meta name="description" content="Reklámtalan Tetris apunak – webes és androidos telepíthető app." />
  <title>Apu Tetris 🧱</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="apple-touch-icon" href="icon-192.png" />
  <link rel="icon" type="image/png" href="icon-192.png" />
  <link rel="stylesheet" href="style.css?v=7" />
</head>
<body>
<div id="app">

  <!-- Fejléc -->
  <header id="header">
    <div id="logo-wrap">
      <div id="logo">APU TETRIS</div>
      <a id="brand-link" href="https://www.marosgergo.hu" target="_blank" rel="noopener">by Maros Gergő</a>
    </div>
    <span id="no-ad-badge">🚫 REKLÁM</span>
    <div id="score-panel">
      <div class="score-box">
        <label>Pont</label>
        <span id="score-val">0</span>
      </div>
      <div class="score-box">
        <label>Sor</label>
        <span id="lines-val">0</span>
      </div>
    </div>
  </header>

  <!-- Játéktér -->
  <section id="game-area">
    <!-- Tábla -->
    <div id="board-wrapper">
      <canvas id="tetris-canvas" aria-label="Tetris játéktér"></canvas>
    </div>

    <!-- Oldalpanel -->
    <aside id="side-panel">
      <div class="panel-box">
        <h3>Köv.</h3>
        <canvas id="next-canvas"></canvas>
      </div>
      <div class="panel-box" id="level-box">
        <h3>Szint</h3>
        <span id="level-val">1</span>
      </div>
      <div class="side-btn-group">
        <button class="side-btn" id="btn-pause" title="Szünet (P/Esc)">
          <span class="btn-icon">⏸</span>
          <span class="btn-txt">Szünet</span>
        </button>
        <button class="side-btn danger" id="btn-restart" title="Újraindítás">
          <span class="btn-icon">🔁</span>
          <span class="btn-txt">Újra</span>
        </button>
      </div>
    </aside>
  </section>

  <!-- Érintővezérlők: 4 nagy, idősbarát gomb -->
  <nav id="touch-controls" aria-label="Érintővezérlők">
    <button class="ctrl-btn rotate-btn" id="btn-rotate" title="Forgatás (↑ / Koppintás)">
      <span class="ctrl-icon">🔄</span>
      <span class="ctrl-label">FORGATÁS</span>
    </button>
    <div class="ctrl-row arrows-row">
      <button class="ctrl-btn arrow-btn" id="btn-left" title="Balra (←)">
        <span class="ctrl-icon">◀</span>
        <span class="ctrl-label">BAL</span>
      </button>
      <button class="ctrl-btn arrow-btn" id="btn-down" title="Le (↓)">
        <span class="ctrl-icon">▼</span>
        <span class="ctrl-label">LE</span>
      </button>
      <button class="ctrl-btn arrow-btn" id="btn-right" title="Jobbra (→)">
        <span class="ctrl-icon">▶</span>
        <span class="ctrl-label">JOBB</span>
      </button>
    </div>
  </nav>

</div>

<!-- Szünet / Game Over overlay -->
<div id="overlay" class="hidden" role="dialog" aria-modal="true" aria-labelledby="overlay-title">
  <h2 id="overlay-title">SZÜNET</h2>
  <p id="overlay-sub"></p>
  <div id="overlay-score"></div>
  <p id="overlay-credit">Készítette: <a href="https://www.marosgergo.hu" target="_blank" rel="noopener">Maros Gergő</a></p>
  <button class="overlay-btn" id="btn-overlay-resume">▶ FOLYTATÁS</button>
  <button class="overlay-btn danger" id="btn-overlay-play">ÚJ JÁTÉK</button>
</div>

<!-- PWA telepítési banner -->
<div id="install-banner" role="banner">
  <p><strong>Telepítsd</strong> az Apu Tetrist – reklámmentesen, offline is játszható!</p>
  <button id="btn-install">📲 Telepítés</button>
  <button id="btn-dismiss" aria-label="Bezárás">✕</button>
</div>

<script src="game.js?v=7"></script>
</body>
</html>
